name: publish-dev-image

on:
  push:
    tags:
      - 'dev-v*'

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: publish-dev-image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/openkubes/ok-console

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_DB: ok_console_test
          POSTGRES_PASSWORD: ok_console_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ok_console_test"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    env:
      OK_CONSOLE_TEST_POSTGRES_URL: postgresql://postgres:ok_console_test_only@127.0.0.1:5432/ok_console_test
    steps:
      - name: Check out the tagged revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require the candidate revision to be on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.17.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Verify the tagged source
        run: |
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm test
          pnpm build

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and publish the candidate
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          provenance: false
          sbom: false
          build-args: |
            VCS_REF=${{ github.sha }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}

      - name: Generate SPDX SBOM for the published digest
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: ok-console.spdx.json
          upload-artifact: false

      - name: Enforce the development vulnerability gate
        uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297 # master pinned 2026-08-22
        with:
          image-ref: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Attest the SBOM
        uses: actions/attest-sbom@bd218ad0dbcb3e146bd073d1d9c6d78e08aa8a0b # v2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: ok-console.spdx.json
          push-to-registry: true

      - name: Install Cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Sign and verify the immutable digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "${IMAGE_NAME}@${DIGEST}"
          cosign verify \
            --certificate-identity "https://github.com/openkubes/ok-console/.github/workflows/publish-dev-image.yaml@${GITHUB_REF}" \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            "${IMAGE_NAME}@${DIGEST}"

      - name: Record candidate identity
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo '## OpenKubes Console development image'
            echo
            echo "- Source revision: \`${GITHUB_SHA}\`"
            echo "- Candidate tag: \`${GITHUB_REF_NAME}\`"
            echo "- Immutable image: \`${IMAGE_NAME}@${DIGEST}\`"
            echo '- Vulnerability gate: CRITICAL,HIGH (unfixed findings ignored for this development gate)'
          } >> "${GITHUB_STEP_SUMMARY}"
