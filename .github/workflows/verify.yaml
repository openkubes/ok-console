name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  console:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_DB: ok_console_test
          POSTGRES_PASSWORD: ok_console_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ok_console_test"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    env:
      OK_CONSOLE_TEST_POSTGRES_URL: postgresql://postgres:ok_console_test_only@127.0.0.1:5432/ok_console_test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Lint
        run: pnpm lint
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Browser and accessibility evidence
        run: pnpm test:e2e
      - name: Build secure runtime image
        run: docker build --build-arg VCS_REF="${{ github.sha }}" --tag ok-console:verify .
      - name: Smoke-test read-only non-root runtime
        run: |
          runtime_id="$(docker run --detach --read-only --cap-drop ALL --security-opt no-new-privileges=true --publish 127.0.0.1:8787:8787 ok-console:verify)"
          trap 'docker rm --force "${runtime_id}"' EXIT
          test "$(docker inspect --format '{{.Config.User}}' ok-console:verify)" = "1000:1000"
          curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 1 http://127.0.0.1:8787/health/live
          curl --fail --silent --show-error http://127.0.0.1:8787/health/ready
          curl --fail --silent --show-error http://127.0.0.1:8787/
      - name: Upload OK-164 browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ok-164-browser-evidence
          path: |
            playwright-report
            test-results/e2e
          if-no-files-found: warn
          retention-days: 14
