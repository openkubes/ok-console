apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - namespace.yaml
  - certificates.yaml
  - postgres-migrations.yaml
  - postgres-cluster.yaml
  - producer-rbac.yaml
  - producer-ownership.yaml
  - producer-cluster-observations.yaml
  - producer-deployment.yaml
  - network-policies.yaml
  - ingress.yaml
images:
  - name: ghcr.io/openkubes/ok-console
    newName: ghcr.io/openkubes/ok-console
    digest: sha256:3ec5620cc45285f6cb580143ee58da0193cd14ea224fa82e6e1e3cb4f3b877ab
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: ok-console
    patch: |-
      - op: add
        path: /metadata/labels/openkubes.io~1environment
        value: ok-shared-live
      - op: add
        path: /spec/template/metadata/labels/openkubes.io~1environment
        value: ok-shared-live
      - op: add
        path: /spec/template/spec/hostAliases
        value:
          - ip: 192.168.100.207
            hostnames:
              - keycloak.ok-shared.internal
      - op: replace
        path: /spec/template/spec/containers/0/env
        value:
          - name: OK_CONSOLE_BFF_HOST
            value: 0.0.0.0
          - name: OK_CONSOLE_BFF_PORT
            value: "8787"
          - name: OK_CONSOLE_SESSION_STORE_MODE
            value: postgres
          - name: OK_CONSOLE_ORIGIN
            value: https://console.ok-shared.internal
          - name: OK_CONSOLE_ENVIRONMENT_ID
            value: ok-shared
          - name: OK_CONSOLE_TENANT_ID
            value: platform
          - name: OK_CONSOLE_SESSION_EPOCH
            value: ok-shared-phase-b1-1
          - name: OK_CONSOLE_AUTHORIZATION_REVISION
            value: ok-shared-bootstrap-v1
          - name: OK_CONSOLE_POSTGRES_URL_FILE
            value: /run/secrets/ok-console/postgres/url
          - name: OK_CONSOLE_POSTGRES_CA_FILE
            value: /run/secrets/ok-console/postgres/ca.pem
          - name: OK_CONSOLE_SESSION_ENVELOPE_PRIMARY_KEY_ID
            value: session-key-v1
          - name: OK_CONSOLE_SESSION_ENVELOPE_KEYS_FILE
            value: /run/secrets/ok-console/session/keys.json
          - name: OK_CONSOLE_OIDC_ENABLED
            value: "true"
          - name: NODE_EXTRA_CA_CERTS
            value: /run/secrets/ok-console/oidc-ca/ca.crt
          - name: OK_CONSOLE_OIDC_PROVIDER_ID
            value: keycloak-openkubes
          - name: OK_CONSOLE_OIDC_ISSUER
            value: https://keycloak.ok-shared.internal/realms/openkubes
          - name: OK_CONSOLE_OIDC_CLIENT_ID
            value: ok-console
          - name: OK_CONSOLE_OIDC_CLIENT_SECRET_FILE
            value: /run/secrets/ok-console/oidc/client-secret
          - name: OK_CONSOLE_OIDC_SUBJECT_MAPPINGS_FILE
            value: /run/secrets/ok-console/oidc/subjects.json
          - name: OK_CONSOLE_LOCAL_ACCESS_MODE
            value: breakglass
          - name: OK_CONSOLE_LOCAL_ACCESS_ACCOUNTS_FILE
            value: /run/secrets/ok-console/local/accounts.json
          - name: OK_CONSOLE_LOCAL_ACCESS_PEPPER_FILE
            value: /run/secrets/ok-console/local/pepper
          - name: OK_CONSOLE_OBSERVED_STATE_MODE
            value: openkubes
          - name: OK_CONSOLE_OBSERVED_STATE_URL
            value: https://observed-state-producer.openkubes-console.svc:8443/api/console-observed-state/v0alpha2
          - name: OK_CONSOLE_OBSERVED_STATE_CA_FILE
            value: /run/secrets/ok-console/observed-state/ca.crt
          - name: OK_CONSOLE_OBSERVED_STATE_CLIENT_CERT_FILE
            value: /run/secrets/ok-console/observed-state/tls.crt
          - name: OK_CONSOLE_OBSERVED_STATE_CLIENT_KEY_FILE
            value: /run/secrets/ok-console/observed-state/tls.key
          - name: OK_CONSOLE_BFF_ENABLE_FAILURE_INJECTION
            value: "false"
      - op: replace
        path: /spec/template/spec/containers/0/volumeMounts
        value:
          - name: postgres
            mountPath: /run/secrets/ok-console/postgres
            readOnly: true
          - name: session
            mountPath: /run/secrets/ok-console/session
            readOnly: true
          - name: local-access
            mountPath: /run/secrets/ok-console/local
            readOnly: true
          - name: oidc
            mountPath: /run/secrets/ok-console/oidc
            readOnly: true
          - name: oidc-ca
            mountPath: /run/secrets/ok-console/oidc-ca
            readOnly: true
          - name: observed-state
            mountPath: /run/secrets/ok-console/observed-state
            readOnly: true
      - op: add
        path: /spec/template/spec/initContainers
        value:
          - name: postgres-migrations
            image: ghcr.io/cloudnative-pg/postgresql:16.10-system-trixie@sha256:26e146bc71ebfc2a3937f729a15161a7fb6cd7c8a0b0007ad60cb53d2371b3fc
            command: ["/bin/sh", "-ec"]
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
            args:
              - |
                for migration in /migrations/006_*.sql; do
                  psql "$PGURI" -v ON_ERROR_STOP=1 -f "$migration"
                done
            env:
              - name: PGURI
                valueFrom:
                  secretKeyRef:
                    name: ok-console-db-app
                    key: uri
            volumeMounts:
              - name: migrations
                mountPath: /migrations
                readOnly: true
      - op: replace
        path: /spec/template/spec/volumes
        value:
          - name: postgres
            projected:
              defaultMode: 288
              sources:
                - secret:
                    name: ok-console-db-app
                    items:
                      - key: uri
                        path: url
                - secret:
                    name: ok-console-db-ca
                    items:
                      - key: ca.crt
                        path: ca.pem
          - name: session
            secret:
              secretName: ok-console-session
              defaultMode: 288
              items:
                - key: keys.json
                  path: keys.json
          - name: local-access
            secret:
              secretName: ok-console-local-access
              defaultMode: 288
              items:
                - key: accounts.json
                  path: accounts.json
                - key: pepper
                  path: pepper
          - name: oidc
            secret:
              secretName: ok-console-oidc
              defaultMode: 288
              items:
                - key: client-secret
                  path: client-secret
                - key: subjects.json
                  path: subjects.json
          - name: oidc-ca
            secret:
              secretName: ok-console-oidc-ca
              defaultMode: 288
              items:
                - key: ca.crt
                  path: ca.crt
          - name: observed-state
            secret:
              secretName: ok-console-observed-state-client-tls
              defaultMode: 288
              items:
                - key: ca.crt
                  path: ca.crt
                - key: tls.crt
                  path: tls.crt
                - key: tls.key
                  path: tls.key
          - name: migrations
            configMap:
              name: ok-console-postgres-migrations
