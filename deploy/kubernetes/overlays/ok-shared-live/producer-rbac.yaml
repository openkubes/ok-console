apiVersion: v1
kind: ServiceAccount
metadata:
  name: observed-state-producer
  namespace: openkubes-console
  labels:
    app.kubernetes.io/name: observed-state-producer
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ok-shared-observed-state-producer
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
  - nonResourceURLs: ["/version"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ok-shared-observed-state-producer
subjects:
  - kind: ServiceAccount
    name: observed-state-producer
    namespace: openkubes-console
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ok-shared-observed-state-producer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: observed-state-producer
  namespace: openkubes-console
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["ok-console"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: observed-state-producer
  namespace: openkubes-console
subjects:
  - kind: ServiceAccount
    name: observed-state-producer
    namespace: openkubes-console
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: observed-state-producer
